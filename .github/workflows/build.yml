name: build-apk
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: localizar Android SDK
        run: |
          set -x
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls /usr/local/lib/android/sdk 2>/dev/null || true
          ls "$ANDROID_HOME" 2>/dev/null || true
          echo "--- build-tools ---"
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || true
          echo "--- platforms ---"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true

      - name: compilar APK (sem Gradle)
        id: build
        continue-on-error: true
        run: |
          set +e
          {
          echo "===== BUILD $(date -u +%FT%TZ) ====="
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME"

          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ 2>/dev/null | sort -V | tail -1)
          BT="${BT%/}"
          echo "build-tools: $BT"
          PLATFORM=$(ls -d "$ANDROID_HOME"/platforms/android-*/ 2>/dev/null | sort -V | tail -1)
          PLATFORM="${PLATFORM%/}"
          echo "platform: $PLATFORM"
          ANDROID_JAR="$PLATFORM/android.jar"
          echo "android.jar existe: $([ -f "$ANDROID_JAR" ] && echo sim || echo NAO)"

          export PATH="$BT:$PATH"
          which aapt2 d8 zipalign apksigner || true

          rm -rf build && mkdir -p build/gen build/obj build/dex

          echo "--- 1. aapt2 compile ---"
          aapt2 compile --dir res -o build/res.zip 2>&1 | tail -5
          ls -l build/res.zip

          echo "--- 2. aapt2 link ---"
          aapt2 link \
            -o build/unsigned.apk \
            -I "$ANDROID_JAR" \
            --min-sdk-version 24 \
            --target-sdk-version 34 \
            --manifest AndroidManifest.xml \
            -A assets \
            --java build/gen \
            --auto-add-overlay \
            build/res.zip 2>&1 | tail -20
          ls -l build/unsigned.apk

          echo "--- 3. javac ---"
          find build/gen src -name '*.java' > build/sources.txt
          wc -l < build/sources.txt
          javac -source 8 -target 8 \
            -bootclasspath "$ANDROID_JAR" \
            -classpath "$ANDROID_JAR" \
            -d build/obj \
            @build/sources.txt 2>&1 | tail -20
          find build/obj -name '*.class' | wc -l

          echo "--- 4. d8 ---"
          cd build/obj && find . -name '*.class' > ../classes.txt && cd ..
          d8 --lib "$ANDROID_JAR" --output build/dex @build/classes.txt 2>&1 | tail -15
          ls -l build/dex/

          echo "--- 5. empacotar dex ---"
          cp build/unsigned.apk build/aligned-input.apk
          cd build/dex && zip -q -X ../../build/aligned-input.apk classes.dex && cd ../..
          unzip -l build/aligned-input.apk | tail -5

          echo "--- 6. zipalign ---"
          zipalign -f -p 4 build/aligned-input.apk build/pocket.apk
          ls -l build/pocket.apk

          echo "--- 7. keystore + apksigner ---"
          keytool -genkeypair -v \
            -keystore build/pocket.keystore \
            -alias pocket \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass pocket123 -keypass pocket123 \
            -dname "CN=Pocket, OU=Dev, O=Thiairo, L=SP, C=BR" 2>&1 | tail -3
          apksigner sign \
            --ks build/pocket.keystore \
            --ks-key-alias pocket \
            --ks-pass pass:pocket123 \
            --key-pass pass:pocket123 \
            --out build/pocket-signed.apk \
            build/pocket.apk 2>&1 | tail -5
          ls -l build/pocket-signed.apk

          echo "--- 8. verificar assinatura ---"
          apksigner verify --print-certs build/pocket-signed.apk 2>&1 | tail -8

          echo "===== OK ====="
          } > build.log 2>&1
          echo "exit=$?"
          tail -60 build.log

      - name: publicar APK e log
        if: always()
        run: |
          mkdir -p out
          cp build.log out/build.log || true
          cp build/pocket-signed.apk out/pocket.apk 2>/dev/null || \
            cp build/pocket.apk out/pocket.apk 2>/dev/null || true
          ls -lh out/ || true
          echo "--- raiz ---"
          ls -lh . | head -20
          echo "--- git status ---"
          git status --porcelain | head -20
          git config user.name build-bot
          git config user.email build@bot.local
          git add -f out || true
          git diff --cached --quiet || git commit -m "apk build $(date -u +%FT%TZ)"
          git push
